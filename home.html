<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <style>
      .hero-title {
  font-size: 4rem;
  font-weight: 800;
  color: white;
  text-align: center;
  text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
  margin-bottom: 20px;
}

.hero-subtitle {
  font-size: 1.6rem;
  font-weight: 600;
  color: white;
  text-align: center;
  text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.4);
}

      main container {
        display: block;
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      main container video {
        position: absolute;
        object-fit: cover;
        z-index: 0;
        width: 100%;
        height: 100%;
      }

      main container .caption {
        z-index: 1;
        position: absolute;
        text-align: center;
        padding: 10px;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-size: cover;
        flex-direction: column;
      }

      .hero-title {
        font-size: 5rem;
        font-weight: 800;
        color: white;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
        margin-bottom: 20px;
      }

      .hero-subtitle {
        font-size: 1.8rem;
        font-weight: 600;
        color: white;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <header>
      <container class="container">
        <div class="logo">
          <a href="./index.html">
            <img src="./images/logo_white.png" alt="careerScops" />
          </a>
        </div>
        <nav>
          <ul>
            <li><a href="./home.html" class="active">Home</a></li>
            <li><a href="./about-us.html">About us</a></li>
            <li><a href="./testimonials.html">Testimonials</a></li>
            <li><a href="./contact-us.html">Contact Us</a></li>
          </ul>
        </nav>
        <div class="auth-buttons">
          <a href="./login.html" class="login-btn">Login</a>
          <a href="./register.html" class="register-btn">Register</a>
        </div>
      </container>
    </header>
    <main>
      <container>
        <video autoplay muted loop onloadstart="this.playbackRate = 0.25;">
          <source src="./images/animated-background.mp4" type="video/mp4" />
        </video>
        <div class="caption">
          <h1 class="hero-title">CareerScopes</h1>
          <p class="hero-subtitle">Services for Individuals, Organisations and Schools</p>
        </div>
      </container>
    </main>
  </body>
</html>
