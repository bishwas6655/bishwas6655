<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <style>
      main container {
        display: block;
        max-width: 100vw;
        min-height: 100vh;
        position: relative;
      }

      main container video {
        position: absolute;
        object-fit: cover;
        z-index: -1;
        width: 100%;
        height: 100%;
      }

      main container .caption {
        z-index: 1;
        text-align: center;
        padding: 10px;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-size: cover;
      }

      .contact-container {
  padding: 2rem;
  width: 90%;
  max-width: 600px;
  background-color: rgba(255, 255, 255, 0.85); /* translucent white */
  border-radius: 20px;
  overflow: hidden;
  display: block;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); 
  backdrop-filter: blur(10px); 
}


      .contact-form h1,
.contact-form p,
label,
input,
textarea,
select {
  color: #1a1a1a;
}


      .form-row {
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
      }

      .form-group {
        width: 100%;
        margin-bottom: 15px;
      }

      input,
      textarea {
        width: 100%;
        padding: 15px;
        background-color: #fcfafa;
        border: 1px solid #333;
        border-radius: 8px;
        color: #0b0b0b;
        font-family: "Inter", sans-serif;
        font-size: 16px;
        outline: none;
      }

      input::placeholder,
      textarea::placeholder {
        color: #040404;
      }

      input:focus,
      textarea:focus {
        border-color: #b8e0d2;
      }

      textarea {
        resize: none;
        min-height: 120px;
      }

      .submit-btn {
        width: 100%;
        padding: 15px;
        background-color: #b8e0d2;
        color: #111;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.3s;
      }

      .submit-btn:hover {
        background-color: #9ed4c2;
      }

      .arrow {
        margin-left: 8px;
        font-size: 20px;
      }

      @media (max-width: 768px) {
        .form-row {
          flex-direction: column;
        }

        .contact-form h1 {
          font-size: 32px;
        }
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 8px;
        color:  #111;
;
        text-align: left;
      }

      .select-wrapper {
        position: relative;
      }

      .select-wrapper::after {
        content: "▼";
        font-size: 12px;
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #777;
        pointer-events: none;
      }

      select {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 16px;
  color: #333;
  background-color: #fff;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-image: none; /* removes double arrow */
  cursor: pointer;
}


      select:focus {
        border-color: #7fb9b1;
        outline: none;
      }
    </style>
  </head>
  <body>
    <header style="background-color: #8ec3b6; position: unset">
      <container class="container">
        <div class="logo">
          <a href="./index.html">
            <img src="./images/logo_white.png" alt="careerScops" />
          </a>
        </div>
        <nav>
          <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./about-us.html">About us</a></li>
            <li><a href="./testimonials.html">Testimonials</a></li>
            <li><a href="./contact-us.html" class="active">Contact Us</a></li>
          </ul>
        </nav>
        <div class="auth-buttons">
          <a href="./login.html" class="login-btn">Login</a>
          <a href="./register.html" class="register-btn">Register</a>
        </div>
      </container>
    </header>

    <main>
      <container>
        <video autoplay muted loop onloadstart="this.playbackRate = 0.25;">
          <source src="./images/animated-background.mp4" type="video/mp4" />
        </video>
        <div class="caption">
          <div class="contact-container">
            <div class="contact-form">
              <h1>Contact Us</h1>
              <p>Have questions? Reach out to us for more information.</p>

              <form>
                <div class="form-row">
                  <div class="form-group">
                    <input
                      type="text"
                      id="firstName"
                      placeholder="First Name"
                      required
                    />
                  </div>
                  <div class="form-group">
                    <input
                      type="text"
                      id="lastName"
                      placeholder="Last Name"
                      required
                    />
                  </div>
                </div>
                <div class="form-group">
  <input
    type="text"
    id="number"
    placeholder="Mobile"
    required
  />
</div>

<div class="form-group">
  <input
    type="email"
    id="email"
    placeholder="Email"
    required
  />
</div>


                <div class="form-group">
                 <!-- Services of Interest -->
<label for="interest">Services of Interest*</label>
<div class="select-wrapper">
  <select id="interest" required>
    <option value="" disabled selected>-- Select a Service --</option>
    <option value="career-coaching">Career Coaching</option>
    <option value="resume-tailoring">Resume Tailoring</option>
    <option value="psychometric-testing">Psychometric Testing</option>
    <option value="networking">Effective Networking</option>
    <option value="interview-coaching">Interview Coaching</option>
    <option value="employment-searching">Employment Searching</option>
    <option value="linkedin-profiling">LinkedIn Profiling</option>
    <option value="packages">Packages</option>
  </select>
</div>
               <!-- State -->
<label for="state">State*</label>
<div class="select-wrapper">
  <select id="state" required>
    <option value="" disabled selected>-- Select State/Territory --</option>
    <option value="victoria">Victoria</option>
    <option value="new-south-wales">New South Wales</option>
    <option value="queensland">Queensland</option>
    <option value="western-australia">Western Australia</option>
    <option value="south-australia">South Australia</option>
    <option value="tasmania">Tasmania</option>
    <option value="northern-territory">Northern Territory</option>
    <option value="act">Australian Capital Territory</option>
  </select>
</div>
</div>


                <div class="form-group">
                  <textarea
                    id="message"
                    placeholder="Message"
                    rows="5"
                    required
                  ></textarea>
                </div>

                <button type="submit" class="submit-btn">
                  Let's Talk! <span class="arrow">→</span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </container>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
