<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Scopes - Register</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
    }

    /* 🔹 Background Video Styling */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .register-container {
      max-width: 450px;
      margin: 60px auto;
      background-color: rgba(255, 255, 255, 0.85);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 1;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo img {
      max-width: 120px;
    }

    .register-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #f9f9f9;
      transition: border-color 0.3s ease;
    }

    input:focus,
    select:focus {
      border-color: #009999;
      background-color: #fff;
      outline: none;
    }

    .select-wrapper {
      position: relative;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
    }

    .checkbox-group input {
      margin-top: 3px;
    }

    .register-btn {
      padding: 14px;
      border: none;
      background-color: #009999;
      color: white;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .register-btn:hover {
      background-color: #007777;
    }

    a {
      color: #007777;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .register-container {
        margin: 20px;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 🔹 Animated Background Video -->
  <video autoplay muted loop id="bg-video" onloadstart="this.playbackRate = 0.5;">
    <source src="./images/animated-background.mp4" type="video/mp4" />
    Your browser does not support HTML5 video.
  </video>

  <div class="register-container">
    <div class="logo">
      <a href="./index.html">
        <img src="./images/logo.jpg" alt="careerScops" />
      </a>
    </div>

    <form class="register-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label for="number">Mobile</label>
        <input type="tel" id="number" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required />
      </div>

      <div class="form-group">
        <label for="interest">Select Of Interest</label>
        <div class="select-wrapper">
          <select id="interest" required>
            <option value="" disabled selected>-- Select a Service --</option>
            <option value="career-coaching">Career Coaching</option>
            <option value="resume-tailoring">Resume Tailoring</option>
            <option value="psychometric-testing">Psychometric Testing</option>
            <option value="networking">Effective Networking</option>
            <option value="interview-coaching">Interview Coaching</option>
            <option value="employment-searching">Employment Searching</option>
            <option value="linkedin-profiling">LinkedIn Profiling</option>
            <option value="packages">Packages</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="state">State*</label>
        <div class="select-wrapper">
          <select id="state" required>
            <option value="" disabled selected>-- Select State/Territory --</option>
            <option value="victoria">Victoria</option>
            <option value="new-south-wales">New South Wales</option>
            <option value="queensland">Queensland</option>
            <option value="western-australia">Western Australia</option>
            <option value="south-australia">South Australia</option>
            <option value="tasmania">Tasmania</option>
            <option value="northern-territory">Northern Territory</option>
            <option value="act">Australian Capital Territory</option>
          </select>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="terms" required />
        <label for="terms">
          I agree to the <a href="#">Privacy Policy</a> and <a href="#">Terms</a>
        </label>
      </div>

      <button type="submit" class="register-btn">Register</button>

    </form>
  </div>
  <script src="js/main.js"></script>

</body>
</html>
